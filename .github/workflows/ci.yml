name: Build and verify guest house
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: guesthouse_test
          POSTGRES_USER: guesthouse_test
          POSTGRES_PASSWORD: integration-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guesthouse_test -d guesthouse_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      RUN_POSTGRES_TESTS: 'true'
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/guesthouse_test
      TEST_DATABASE_USERNAME: guesthouse_test
      TEST_DATABASE_PASSWORD: integration-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit and PostgreSQL integration tests
        run: chmod +x mvnw && ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability check
        run: npm audit --audit-level=high
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build backend image
        run: docker build --tag cst-guesthouse-backend:ci backend
      - name: Build frontend image
        run: docker build --tag cst-guesthouse-frontend:ci frontend
