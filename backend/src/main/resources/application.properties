spring.application.name=guesthouse
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/guesthouse}
spring.datasource.username=${POSTGRES_USER:guesthouse}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration=${JWT_EXPIRATION:3600}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.registration-enabled=${REGISTRATION_ENABLED:false}
app.contact.phone=${GUESTHOUSE_PHONE:}
app.contact.email=${GUESTHOUSE_EMAIL:}
app.contact.address=${GUESTHOUSE_ADDRESS:}
app.dining.breakfast-start=${DINING_BREAKFAST_START:07:00}
app.dining.breakfast-end=${DINING_BREAKFAST_END:09:00}
app.dining.lunch-start=${DINING_LUNCH_START:12:00}
app.dining.lunch-end=${DINING_LUNCH_END:14:00}
app.dining.dinner-start=${DINING_DINNER_START:18:00}
app.dining.dinner-end=${DINING_DINNER_END:20:00}
